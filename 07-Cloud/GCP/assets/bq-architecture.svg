<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Architecture de BigQuery</title>
  <desc id="d">BigQuery sépare le stockage et le calcul. Le stockage range les tables par colonnes. Le calcul utilise à la demande des centaines de machines appelées slots, qui lisent uniquement les colonnes demandées par la requête, via un réseau très rapide.</desc>
  <defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5b6472"/></marker></defs>
  <style>.h{font-size:17px;font-weight:700;fill:#1f2937}.s{font-size:12.5px;fill:#5b6472}.b{font-size:13px;font-weight:600;fill:#1f2937}.m{font-family:ui-monospace,Consolas,monospace;font-size:13px;fill:#1f2937}.l{stroke:#5b6472;stroke-width:1.8;fill:none;marker-end:url(#f)}</style>
  <rect width="900" height="400" fill="#fff"/>
  <!-- requete -->
  <rect x="270" y="18" width="360" height="52" rx="10" fill="#fff4e5" stroke="#e8a33d" stroke-width="1.5"/>
  <text x="450" y="40" text-anchor="middle" class="b">Votre requête SQL</text>
  <text x="450" y="59" text-anchor="middle" class="m">SELECT magasin, SUM(montant) …</text>
  <path d="M450,70 L450,100" class="l"/>
  <!-- calcul -->
  <rect x="30" y="104" width="840" height="110" rx="12" fill="#eef4ff" stroke="#4a7bd0" stroke-width="1.5"/>
  <text x="50" y="132" class="h">Calcul</text><text x="112" y="132" class="s">moteur Dremel · des unités de calcul (« slots ») allouées à la demande, le temps de la requête</text>
  <g fill="#fff" stroke="#4a7bd0">
    <rect x="50" y="150" width="70" height="44" rx="6"/><rect x="132" y="150" width="70" height="44" rx="6"/><rect x="214" y="150" width="70" height="44" rx="6"/><rect x="296" y="150" width="70" height="44" rx="6"/><rect x="378" y="150" width="70" height="44" rx="6"/><rect x="460" y="150" width="70" height="44" rx="6"/><rect x="542" y="150" width="70" height="44" rx="6"/><rect x="624" y="150" width="70" height="44" rx="6"/>
  </g>
  <g class="s" text-anchor="middle"><text x="85" y="177">slot</text><text x="167" y="177">slot</text><text x="249" y="177">slot</text><text x="331" y="177">slot</text><text x="413" y="177">slot</text><text x="495" y="177">slot</text><text x="577" y="177">slot</text><text x="659" y="177">slot</text></g>
  <text x="780" y="177" text-anchor="middle" class="s">… des centaines</text>
  <!-- reseau -->
  <path d="M300,214 L300,262" class="l"/><path d="M450,214 L450,262" class="l"/><path d="M600,214 L600,262" class="l"/>
  <text x="618" y="243" class="s">réseau très rapide</text>
  <!-- stockage -->
  <rect x="30" y="266" width="840" height="116" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="50" y="294" class="h">Stockage</text><text x="134" y="294" class="s">format Capacitor · chaque colonne est rangée et compressée séparément : seules les colonnes utiles sont lues</text>
  <g>
    <rect x="50" y="308" width="150" height="56" rx="6" fill="#fde8e4" stroke="#e2603f"/><text x="125" y="332" text-anchor="middle" class="b">date</text><text x="125" y="352" text-anchor="middle" class="s">lue</text>
    <rect x="215" y="308" width="150" height="56" rx="6" fill="#fde8e4" stroke="#e2603f"/><text x="290" y="332" text-anchor="middle" class="b">magasin</text><text x="290" y="352" text-anchor="middle" class="s">lue</text>
    <rect x="380" y="308" width="150" height="56" rx="6" fill="#fde8e4" stroke="#e2603f"/><text x="455" y="332" text-anchor="middle" class="b">montant</text><text x="455" y="352" text-anchor="middle" class="s">lue</text>
    <rect x="545" y="308" width="150" height="56" rx="6" fill="#fff" stroke="#c4c9d1" stroke-dasharray="4 3"/><text x="620" y="332" text-anchor="middle" class="b" fill="#9ca3af">client</text><text x="620" y="352" text-anchor="middle" class="s">ignorée</text>
    <rect x="710" y="308" width="140" height="56" rx="6" fill="#fff" stroke="#c4c9d1" stroke-dasharray="4 3"/><text x="780" y="332" text-anchor="middle" class="b" fill="#9ca3af">commentaire</text><text x="780" y="352" text-anchor="middle" class="s">ignorée</text>
  </g>
</svg>
