<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Partitionnement et clustering</title>
  <desc id="d">À gauche, une table de commandes non organisée : une requête doit tout lire. À droite, la même table partitionnée par date et clusterisée par magasin : la requête qui filtre le 2 novembre et le magasin de Lyon ne lit qu'une partition, et dans cette partition, seulement le bloc de Lyon.</desc>
  <defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#4a7bd0"/></marker></defs>
  <style>.h{font-size:15px;font-weight:700;fill:#1f2937}.s{font-size:12px;fill:#5b6472}.c{font-size:12.5px;fill:#1f2937}.th{font-size:12.5px;font-weight:600;fill:#fff}.m{font-family:ui-monospace,Consolas,monospace;font-size:12px}</style>
  <rect width="960" height="540" fill="#fff"/>
  <!-- query -->
  <rect x="20" y="12" width="920" height="44" rx="10" fill="#fff4e5" stroke="#e8a33d" stroke-width="1.5"/>
  <text x="38" y="39" class="m" fill="#1f2937">SELECT SUM(montant) FROM commandes WHERE date_commande = '2026-11-02' AND magasin = 'Lyon'</text>
  <!-- left table -->
  <text x="20" y="86" class="h">Table non organisée</text><text x="20" y="104" class="s">les lignes sont dans l'ordre d'arrivée : tout est lu</text>
  <g>
    <rect x="20" y="116" width="330" height="26" fill="#374151"/>
    <text x="32" y="134" class="th">date_commande</text><text x="160" y="134" class="th">magasin</text><text x="260" y="134" class="th">montant</text>
  </g>
  <g class="c">
    <rect x="20" y="142" width="330" height="26" fill="#fdf3d9"/><text x="32" y="160">2026-11-01</text><text x="160" y="160">Lyon</text><text x="260" y="160">120</text>
    <rect x="20" y="168" width="330" height="26" fill="#e3f1e3"/><text x="32" y="186">2026-11-02</text><text x="160" y="186">Paris</text><text x="260" y="186">80</text>
    <rect x="20" y="194" width="330" height="26" fill="#ece6f6"/><text x="32" y="212">2026-11-03</text><text x="160" y="212">Lille</text><text x="260" y="212">45</text>
    <rect x="20" y="220" width="330" height="26" fill="#e3f1e3"/><text x="32" y="238">2026-11-02</text><text x="160" y="238">Lyon</text><text x="260" y="238">200</text>
    <rect x="20" y="246" width="330" height="26" fill="#fdf3d9"/><text x="32" y="264">2026-11-01</text><text x="160" y="264">Paris</text><text x="260" y="264">95</text>
    <rect x="20" y="272" width="330" height="26" fill="#e3f1e3"/><text x="32" y="290">2026-11-02</text><text x="160" y="290">Lille</text><text x="260" y="290">60</text>
    <rect x="20" y="298" width="330" height="26" fill="#ece6f6"/><text x="32" y="316">2026-11-03</text><text x="160" y="316">Lyon</text><text x="260" y="316">150</text>
    <rect x="20" y="324" width="330" height="26" fill="#e3f1e3"/><text x="32" y="342">2026-11-02</text><text x="160" y="342">Lyon</text><text x="260" y="342">75</text>
    <rect x="20" y="350" width="330" height="26" fill="#fdf3d9"/><text x="32" y="368">2026-11-01</text><text x="160" y="368">Lille</text><text x="260" y="368">30</text>
    <rect x="20" y="376" width="330" height="26" fill="#e3f1e3"/><text x="32" y="394">2026-11-02</text><text x="160" y="394">Paris</text><text x="260" y="394">110</text>
  </g>
  <rect x="20" y="420" width="330" height="40" rx="8" fill="#fde8e4" stroke="#e2603f"/>
  <text x="185" y="445" text-anchor="middle" class="h" fill="#b8432a">10 lignes lues sur 10</text>
  <!-- arrow -->
  <polygon points="364,250 414,250 414,238 440,260 414,282 414,270 364,270" fill="#4a7bd0"/>
  <text x="402" y="304" text-anchor="middle" class="s">partitionnée</text><text x="402" y="320" text-anchor="middle" class="s">par date,</text><text x="402" y="336" text-anchor="middle" class="s">clusterisée</text><text x="402" y="352" text-anchor="middle" class="s">par magasin</text>
  <!-- right -->
  <text x="470" y="86" class="h">Table partitionnée et clusterisée</text><text x="470" y="104" class="s">une partition par jour ; dans chaque partition, les lignes sont triées par magasin</text>
  <!-- p1 skipped -->
  <rect x="470" y="116" width="110" height="78" rx="8" fill="#fdf3d9" stroke="#d9b65a" stroke-dasharray="4 3"/>
  <text x="525" y="150" text-anchor="middle" class="c" font-weight="700">2026-11-01</text><text x="525" y="170" text-anchor="middle" class="s">ignorée</text>
  <g opacity="0.35" class="c">
    <rect x="590" y="116" width="350" height="26" fill="#fdf3d9"/><text x="602" y="134">2026-11-01</text><text x="730" y="134">Lille</text><text x="840" y="134">30</text>
    <rect x="590" y="142" width="350" height="26" fill="#fdf3d9"/><text x="602" y="160">2026-11-01</text><text x="730" y="160">Lyon</text><text x="840" y="160">120</text>
    <rect x="590" y="168" width="350" height="26" fill="#fdf3d9"/><text x="602" y="186">2026-11-01</text><text x="730" y="186">Paris</text><text x="840" y="186">95</text>
  </g>
  <!-- p2 read -->
  <rect x="470" y="206" width="110" height="156" rx="8" fill="#e3f1e3" stroke="#3f9a52" stroke-width="2"/>
  <text x="525" y="276" text-anchor="middle" class="c" font-weight="700">2026-11-02</text><text x="525" y="296" text-anchor="middle" class="s">lue</text>
  <g class="c">
    <g opacity="0.35">
    <rect x="590" y="206" width="350" height="26" fill="#e3f1e3"/><text x="602" y="224">2026-11-02</text><text x="730" y="224">Lille</text><text x="840" y="224">60</text>
    </g>
    <rect x="590" y="232" width="350" height="52" fill="#c9e7cf" stroke="#3f9a52" stroke-width="2"/>
    <text x="602" y="250">2026-11-02</text><text x="730" y="250">Lyon</text><text x="840" y="250">200</text>
    <text x="602" y="276">2026-11-02</text><text x="730" y="276">Lyon</text><text x="840" y="276">75</text>
    <g opacity="0.35">
    <rect x="590" y="284" width="350" height="26" fill="#e3f1e3"/><text x="602" y="302">2026-11-02</text><text x="730" y="302">Paris</text><text x="840" y="302">80</text>
    <rect x="590" y="310" width="350" height="26" fill="#e3f1e3"/><text x="602" y="328">2026-11-02</text><text x="730" y="328">Paris</text><text x="840" y="328">110</text>
    </g>
  </g>
  <text x="932" y="263" text-anchor="end" class="s" font-weight="600" fill="#2f7a40">bloc lu</text>
  <!-- p3 skipped -->
  <rect x="470" y="374" width="110" height="52" rx="8" fill="#ece6f6" stroke="#a48fd0" stroke-dasharray="4 3"/>
  <text x="525" y="396" text-anchor="middle" class="c" font-weight="700">2026-11-03</text><text x="525" y="414" text-anchor="middle" class="s">ignorée</text>
  <g opacity="0.35" class="c">
    <rect x="590" y="374" width="350" height="26" fill="#ece6f6"/><text x="602" y="392">2026-11-03</text><text x="730" y="392">Lille</text><text x="840" y="392">45</text>
    <rect x="590" y="400" width="350" height="26" fill="#ece6f6"/><text x="602" y="418">2026-11-03</text><text x="730" y="418">Lyon</text><text x="840" y="418">150</text>
  </g>
  <rect x="470" y="440" width="470" height="76" rx="8" fill="#e3f1e3" stroke="#3f9a52"/>
  <text x="705" y="464" text-anchor="middle" class="h" fill="#2f7a40">2 lignes lues sur 10</text>
  <text x="705" y="486" text-anchor="middle" class="s">partitionnement : 2 partitions sur 3 ignorées</text><text x="705" y="504" text-anchor="middle" class="s">clustering : dans la partition lue, seul le bloc « Lyon » est lu</text>
</svg>
