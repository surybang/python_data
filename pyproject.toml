[project]
name = "python-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "surybang", email = "hos.fabien@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "manim>=0.21.0",
    "matplotlib>=3.11.2",
    "scikit-learn>=1.9.1",
    "shap>=0.52.0",
    "tabicl>=2.2.0",
    "torch>=2.14.1",
]

[project.scripts]
python-data = "python_data:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint.per-file-ignores]
"src/python_data/manim/compile_vs_interprete.py" = ["F403", "F405"]
